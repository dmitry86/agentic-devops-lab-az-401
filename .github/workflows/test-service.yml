name: Test status service

on:
  push:
    branches: [build-status-service, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run HTTP tests
        run: python -m unittest -v test_app
  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Simulate deployment
        run: echo "Tests passed. Ready to deploy."
