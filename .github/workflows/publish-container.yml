name: Publish container

on:
  push:
    branches: [build-status-service]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -v

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build container image
        run: docker build --tag ghcr.io/dmitry86/cloudops-status:${{ github.sha }} .

      - name: Push container image
        run: docker push ghcr.io/dmitry86/cloudops-status:${{ github.sha }}
