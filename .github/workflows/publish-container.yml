name: Publish container

on:
  push:
    branches: [build-status-service]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run tests
        run: python3 -m unittest discover -v

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build container image
        run: docker build --tag ghcr.io/dmitry86/cloudops-status:${{ github.sha }} .

      - name: Push container image
        run: docker push ghcr.io/dmitry86/cloudops-status:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: training-production
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10

    steps:
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          client-id: f7f9be44-24eb-4240-8e6d-24a929d8b7ed
          tenant-id: e5ac86ef-c732-4b85-b89f-0d63d50a811a
          subscription-id: 9198ecec-8541-47b2-ae85-59a1ebfe5517

      - name: Update Container App image
        run: az containerapp update --resource-group rg-cloudops-status-lab --name cloudops-status --image ghcr.io/dmitry86/cloudops-status:${{ github.sha }} --subscription 9198ecec-8541-47b2-ae85-59a1ebfe5517
